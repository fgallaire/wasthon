name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cache external source trees: CPython tarball, sqlite zip, expat, xz,
      # zstd, bzip2 + emsdk. Without this, every CI run re-downloads ~200 MB
      # and re-installs emsdk (~3 min). Key on build.sh because that's where
      # versions are pinned.
      - name: Cache external/
        uses: actions/cache@v4
        with:
          path: external/
          key: external-${{ hashFiles('build.sh') }}
          restore-keys: |
            external-

      # Cache build/*.o object files too — cold compiles take 5-10 min.
      # Key on src/ + build.sh because any of those changing should force
      # a rebuild of the touched modules anyway.
      - name: Cache build objects
        uses: actions/cache@v4
        with:
          path: |
            build/*.o
            build/libmpdec/
            build/bzip2/
            build/clinic/
          key: build-objs-${{ hashFiles('src/**', 'build.sh') }}
          restore-keys: |
            build-objs-

      - name: Install Playwright (Python)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # Build every per-module artifact (so the individual test-*.html
      # pages can fetch their .mjs/.wasm). `all` calls each known module's
      # case in build.sh.
      - name: Build all modules
        run: ./build.sh all

      # Build both bundles for the test-wasthon{,-full}.html pages.
      - name: Build wasthon (light) bundle
        run: ./build.sh wasthon

      - name: Build wasthon-full bundle
        run: ./build.sh wasthon-full

      - name: Run headless tests
        run: python3 test.py

      # ----- Pages deployment staging (push to main only) -----
      # Assembles the static site to publish: the loader pages + the
      # freshly-built bundles, with a root index.html that redirects to
      # the loader index. All loader pages already load Brython from the
      # jsdelivr CDN, so no symlink rewriting is needed; `brython-dev` is
      # a local-only untracked symlink absent from CI checkouts.
      - name: Stage Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp -r loader _site/
          cp -r build  _site/
          printf '<!doctype html><meta charset="utf-8"><title>wasthon</title><meta http-equiv="refresh" content="0; url=loader/"><p>Redirecting to <a href="loader/">loader/</a>…</p>\n' > _site/index.html

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
