name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The bridge's unit tests: tests/_bridgetest built against src/ alone and
  # run in Node. No CPython module, no other repository — the repositories
  # built on the bridge (Wastdlib, NumBry, BryTorch, Brygame) test the rest.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: emsdk/
          key: emsdk-5.0.7

      - name: Install emsdk 5.0.7
        run: |
          [ -d emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk && ./emsdk install 5.0.7 && ./emsdk activate 5.0.7

      - name: Bridge unit tests
        run: |
          source emsdk/emsdk_env.sh
          tests/run.sh

      # The same tests, in the browser: loader/test-bridge.html runs
      # tests/lifetime.py against the _bridgetest the step above built.
      - name: Stage Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site/tests/build
          cp -r loader _site/
          cp tests/lifetime.py _site/tests/
          cp tests/build/_bridgetest.mjs tests/build/_bridgetest.wasm _site/tests/build/
          printf '<!doctype html><meta charset="utf-8"><title>wasthon</title><meta http-equiv="refresh" content="0; url=loader/test-bridge.html"><p>Redirecting to <a href="loader/test-bridge.html">the bridge unit tests</a>…</p>\n' > _site/index.html

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
