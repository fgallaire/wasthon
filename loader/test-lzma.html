<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wasthon — _lzma smoke test</title>
<script src="https://cdn.jsdelivr.net/npm/brython@3.14.1/brython.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/brython@3.14.1/brython_stdlib.js"></script>
<script src="./wasthon-loader.js"></script>
</head>
<body>
<p style="font-size:0.85em;margin:0 0 1em 0;"><a href="index.html">← back to index</a></p>
<h1>Wasthon — _lzma smoke test</h1>
<pre id="log" style="background:#f4f4f4;padding:1em;font-size:13px;line-height:1.4;"></pre>

<script type="module">
const log = (...args) => {
    document.getElementById('log').textContent += args.map(a =>
        typeof a === 'string' ? a : String(a)).join(' ') + '\n';
    console.log('[lzma]', ...args);
};
window.__wasthon_log = log;

try {
    log('Loading _lzma…');
    await wasthonLoad('_lzma', '../build/_lzma.mjs');
    log('Loaded. Running smoke tests…\n');

    const py = document.createElement('script');
    py.type = 'text/python';
    py.textContent = `
from browser import window
log = window.__wasthon_log

import _lzma

# Test 1: module attributes
log('Test 1: module attributes')
for name in ('LZMACompressor', 'LZMADecompressor', 'FORMAT_XZ', 'FORMAT_ALONE', 'FORMAT_RAW'):
    log(f'  _lzma.{name}: {"OK" if hasattr(_lzma, name) else "MISSING"}')

# Test 2: round-trip XZ format (default)
log('\\nTest 2: round-trip XZ format')
try:
    data = b'Hello, Wasthon LZMA! ' * 100
    log(f'  original size: {len(data)} bytes')
    c = _lzma.LZMACompressor()
    compressed = c.compress(data) + c.flush()
    log(f'  compressed size: {len(compressed)} bytes')
    log(f'  ratio: {len(compressed)/len(data):.3f}')
    log(f'  first 6 bytes: {compressed[:6]!r}')
    d = _lzma.LZMADecompressor()
    restored = d.decompress(compressed)
    log(f'  decompressed size: {len(restored)} bytes')
    log(f'  match: {"OK" if restored == data else "FAIL"}')
except Exception as e:
    log(f'  FAIL: {type(e).__name__}: {e}')

# Test 3: XZ magic bytes
log('\\nTest 3: XZ magic bytes (fd 37 7a 58 5a 00)')
try:
    c = _lzma.LZMACompressor()
    out = c.compress(b'x') + c.flush()
    magic = bytes([0xfd, 0x37, 0x7a, 0x58, 0x5a, 0x00])
    log(f'  first 6 bytes: {out[:6].hex()}')
    log(f'  matches XZ magic: {"OK" if out[:6] == magic else "FAIL"}')
except Exception as e:
    log(f'  FAIL: {type(e).__name__}: {e}')

# Test 4: streamed
log('\\nTest 4: streamed decompression')
try:
    data = bytes(range(256)) * 100  # 25600 bytes
    c = _lzma.LZMACompressor()
    compressed = c.compress(data) + c.flush()
    log(f'  compressed {len(data)} → {len(compressed)} bytes')
    d = _lzma.LZMADecompressor()
    chunks = []
    chunk_size = 50
    for i in range(0, len(compressed), chunk_size):
        chunks.append(d.decompress(compressed[i:i+chunk_size]))
    restored = b''.join(chunks)
    log(f'  decompressed in {len(chunks)} chunks → {len(restored)} bytes')
    log(f'  match: {"OK" if restored == data else "FAIL"}')
except Exception as e:
    log(f'  FAIL: {type(e).__name__}: {e}')

# Test 5: ALONE format (legacy .lzma)
log('\\nTest 5: ALONE format')
try:
    data = b'The quick brown fox. ' * 50
    c = _lzma.LZMACompressor(format=_lzma.FORMAT_ALONE)
    compressed = c.compress(data) + c.flush()
    log(f'  compressed {len(data)} → {len(compressed)} bytes')
    d = _lzma.LZMADecompressor(format=_lzma.FORMAT_ALONE)
    restored = d.decompress(compressed)
    log(f'  match: {"OK" if restored == data else "FAIL"}')
except Exception as e:
    log(f'  FAIL: {type(e).__name__}: {e}')

log('\\n=== done ===')
`;
    document.body.appendChild(py);
    brython({debug: 1});
} catch (e) {
    log('=== FAILED === ' + e.message);
    console.error(e);
}
</script>
</body>
</html>
