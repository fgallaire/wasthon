<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wasthon — _json bench vs Brython</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  table { border-collapse: collapse; margin: 1rem 0; width: 100%; font-size: 13px; }
  th, td { padding: 5px 10px; text-align: right; border-bottom: 1px solid #ddd; font-variant-numeric: tabular-nums; }
  th { background: #f4f4f4; text-align: left; }
  td:first-child { text-align: left; }
  .speedup { background: #fff8e0; font-weight: 600; }
  #log { white-space: pre-wrap; font-family: monospace; background: #f8f8f8; padding: 1rem; border-radius: 4px; max-height: 300px; overflow: auto; font-size: 12px; }
</style>
<script src="./brython-src.js"></script>
<script src="./wasthon-loader.js"></script>
</head>
<body>
<p style="font-size:0.85em;margin:0 0 1em 0;"><a href="index.html">← back to index</a></p>

<h1>Wasthon — <code>_json</code> low-level vs Brython's pure-Python <code>json.encoder.encode_basestring</code></h1>
<p>Comparing wasthon's <code>_json.encode_basestring</code> (C state machine via WASM)
against the pure-Python fallback that Brython uses when <code>_json</code> isn't
available.</p>

<table id="results">
  <thead><tr>
    <th>Operation</th><th>wasthon ms/op</th><th>Brython ms/op</th>
    <th class="speedup">Speedup</th>
  </tr></thead>
  <tbody></tbody>
</table>

<h3>Log</h3>
<pre id="log"></pre>

<script type="module">
const log = (...args) => {
    const el = document.getElementById('log');
    el.textContent += args.map(a => typeof a === 'string' ? a : String(a)).join(' ') + '\n';
    el.scrollTop = el.scrollHeight;
};
window.__bench_log = log;
window.__bench_render = (op, wMs, bMs) => {
    const tbody = document.querySelector('#results tbody');
    const tr = document.createElement('tr');
    const speedup = (bMs > 0 && wMs > 0) ? (bMs / wMs).toFixed(2) + 'x' : '—';
    tr.innerHTML = `
        <td>${op}</td>
        <td>${wMs < 0 ? 'FAIL' : wMs === 0 ? '< 0.001' : wMs.toFixed(4)}</td>
        <td>${bMs < 0 ? 'FAIL' : bMs === 0 ? '< 0.001' : bMs.toFixed(4)}</td>
        <td class="speedup">${speedup}</td>
    `;
    tbody.appendChild(tr);
};

try {
    log('Loading _json…');
    await wasthonLoad('_wasthon_json', '../build/_json.mjs', { initName: '_json' });
    log('Loaded. Booting Brython…');

    const py = document.createElement('script');
    py.type = 'text/python';
    py.textContent = `
from browser import window
log = window.__bench_log
render = window.__bench_render
perf = window.performance.now

import _wasthon_json as wj

# Pure-Python encode_basestring — equivalent to CPython's Python fallback
# in json.encoder when _json is unavailable. No regex, just char iteration
# to avoid escape-string headaches inside this embedded template.
ESCAPE_DCT = {
    chr(92): chr(92)+chr(92),
    chr(34): chr(92)+chr(34),
    chr(8): chr(92)+'b',
    chr(12): chr(92)+'f',
    chr(10): chr(92)+'n',
    chr(13): chr(92)+'r',
    chr(9): chr(92)+'t',
}
for i in range(0x20):
    c = chr(i)
    if c not in ESCAPE_DCT:
        ESCAPE_DCT[c] = chr(92) + 'u%04x' % i

def py_encode_basestring(s):
    parts = [chr(34)]
    for ch in s:
        esc = ESCAPE_DCT.get(ch)
        parts.append(esc if esc is not None else ch)
    parts.append(chr(34))
    return ''.join(parts)

# Test data: various string sizes/contents
S_ASCII_SHORT  = "hello world"
S_ASCII_LONG   = "hello world! " * 100  # ~1300 chars
S_WITH_ESCAPES = ('Line 1\\nTab\\there\\n"quoted"\\nback' + chr(92) + 'slash ') * 50  # ~1700 chars with many escapes
S_BIG_TEXT     = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. " * 200  # ~11k chars

def time_loop(fn, iters):
    fn(); fn()
    t0 = perf()
    for _ in range(iters):
        fn()
    t1 = perf()
    return (t1 - t0) / iters

cases = [
    ("encode 11-char ASCII", S_ASCII_SHORT,  500),
    ("encode 1300-char ASCII", S_ASCII_LONG, 100),
    ("encode 1700-char w/ many escapes", S_WITH_ESCAPES, 100),
    ("encode 11000-char Lorem Ipsum", S_BIG_TEXT, 20),
]

log('Running benchmarks…\\n')
for name, data, iters in cases:
    try:
        wms = time_loop(lambda d=data: wj.encode_basestring(d), iters)
    except Exception as e:
        log(f'  wasthon {name} FAIL: {type(e).__name__}: {e}')
        wms = -1
    try:
        bms = time_loop(lambda d=data: py_encode_basestring(d), iters)
    except Exception as e:
        log(f'  brython {name} FAIL: {type(e).__name__}: {e}')
        bms = -1
    log(f'  {name:36}  wasthon={wms:.4f}  brython={bms:.4f}')
    render(name, wms, bms)

log('\\n=== done ===')
`;
    document.body.appendChild(py);
    brython({debug: 1});
} catch (e) {
    log('FAILED: ' + e.message);
    console.error(e);
}
</script>
</body>
</html>
