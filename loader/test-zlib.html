<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wasthon — zlib smoke test</title>
<script src="./brython-src.js"></script>
<script src="./wasthon-loader.js"></script>
</head>
<body>
<p style="font-size:0.85em;margin:0 0 1em 0;"><a href="index.html">← back to index</a></p>
<h1>wasthon — zlib round-trip test</h1>
<pre id="log" style="background:#f4f4f4;padding:1em;font-size:13px;line-height:1.4;"></pre>

<script type="module">
const log = (...args) => {
    const fmt = a => typeof a === 'string' ? a :
        (typeof a === 'number' || typeof a === 'boolean') ? String(a) :
        (() => { try { return JSON.stringify(a); } catch (_) { return Object.prototype.toString.call(a); }})();
    document.getElementById('log').textContent += args.map(fmt).join(' ') + '\n';
    console.log('[zlib]', ...args);
};
window.__wasthon_log = log;

try {
    log('Loading _zlib…');
    await wasthonLoad('zlib', '../build/_zlib.mjs');
    log('Loaded. Running smoke tests…\n');

    const py = document.createElement('script');
    py.type = 'text/python';
    py.textContent = `
from browser import window
log = window.__wasthon_log

import zlib

# Test 1: round-trip on a small string
msg = b'The quick brown fox jumps over the lazy dog' * 100
log(f'Test 1: round-trip on {len(msg)} bytes')
comp = zlib.compress(msg)
log(f'  compressed: {len(comp)} bytes  (ratio: {len(comp)/len(msg)*100:.1f}%)')
dec = zlib.decompress(comp)
ok = dec == msg
log(f'  decompressed matches original: {"✓" if ok else "✗"}')

# Test 2: ZLIB_VERSION constant
log(f'\\nTest 2: zlib.ZLIB_VERSION = {zlib.ZLIB_VERSION}')

# Test 3: crc32 / adler32 on b'abc'
crc = zlib.crc32(b'abc')
adler = zlib.adler32(b'abc')
log(f'\\nTest 3: zlib.crc32(b"abc")   = 0x{crc:08x}  (expected 0x352441c2)')
log(f'        zlib.adler32(b"abc") = 0x{adler:08x}  (expected 0x024d0127)')
log(f'  crc32 match:   {"✓" if crc == 0x352441c2 else "✗"}')
log(f'  adler32 match: {"✓" if adler == 0x024d0127 else "✗"}')

# Test 4: empty input
log(f'\\nTest 4: zlib.compress(b"") roundtrip')
e_comp = zlib.compress(b'')
e_dec  = zlib.decompress(e_comp)
log(f'  empty round-trip: {"✓" if e_dec == b"" else "✗"}')

# Test 5: best compression of repetitive input
big = b'A' * 100_000
big_comp = zlib.compress(big, 9)
log(f'\\nTest 5: compress 100000 bytes of "A" at level 9')
log(f'  compressed to {len(big_comp)} bytes (ratio: {len(big_comp)/len(big)*100:.3f}%)')
log(f'  round-trip: {"✓" if zlib.decompress(big_comp) == big else "✗"}')

log('\\n=== done ===')
`;
    document.body.appendChild(py);
    brython({debug: 1});
} catch (e) {
    log('=== FAILED ===', e.message);
    console.error(e);
}
</script>
</body>
</html>
