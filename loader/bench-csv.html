<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wasthon — _csv bench vs Brython's pure-Python csv</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  table { border-collapse: collapse; margin: 1rem 0; width: 100%; font-size: 13px; }
  th, td { padding: 5px 10px; text-align: right; border-bottom: 1px solid #ddd; font-variant-numeric: tabular-nums; }
  th { background: #f4f4f4; text-align: left; }
  td:first-child { text-align: left; }
  td.match { color: #0a0; }
  td.miss  { color: #a00; }
  .speedup { background: #fff8e0; font-weight: 600; }
  #log { white-space: pre-wrap; font-family: monospace; background: #f8f8f8; padding: 1rem; border-radius: 4px; max-height: 300px; overflow: auto; font-size: 12px; }
</style>
<script src="./brython-src.js"></script>
<script src="./wasthon-loader.js"></script>
</head>
<body>
<p style="font-size:0.85em;margin:0 0 1em 0;"><a href="index.html">← back to index</a></p>

<h1>Wasthon — <code>_csv</code> vs Brython's pure-Python <code>csv</code></h1>
<p>CPython's <code>Modules/_csv.c</code> via WASM, against Brython's <code>Lib/csv.py</code>.</p>

<table id="results">
  <thead><tr>
    <th>Operation</th><th>wasthon ms/call</th><th>Brython ms/call</th>
    <th class="speedup">Speedup</th><th>Match</th>
  </tr></thead>
  <tbody></tbody>
</table>

<h3>Log</h3>
<pre id="log"></pre>

<script type="module">
const log = (...args) => {
    const el = document.getElementById('log');
    el.textContent += args.map(a => typeof a === 'string' ? a : String(a)).join(' ') + '\n';
    el.scrollTop = el.scrollHeight;
};
window.__bench_log = log;
window.__bench_render = (op, wMs, bMs, ok) => {
    const tbody = document.querySelector('#results tbody');
    const tr = document.createElement('tr');
    const speedup = (bMs > 0 && wMs > 0) ? (bMs / wMs).toFixed(2) + '×' : '—';
    tr.innerHTML = `
        <td>${op}</td>
        <td>${wMs < 0 ? 'FAIL' : wMs === 0 ? '< 0.001' : wMs.toFixed(4)}</td>
        <td>${bMs < 0 ? 'FAIL' : bMs === 0 ? '< 0.001' : bMs.toFixed(4)}</td>
        <td class="speedup">${speedup}</td>
        <td class="${ok ? 'match' : 'miss'}">${ok ? '✓' : '✗'}</td>
    `;
    tbody.appendChild(tr);
};

try {
    log('Loading wasthon _csv…');
    await wasthonLoad('_wasthon_csv', '../build/_csv.mjs', { initName: '_csv' });
    log('Loaded. Booting Brython…');

    const py = document.createElement('script');
    py.type = 'text/python';
    py.textContent = `
from browser import window
log = window.__bench_log
render = window.__bench_render
perf = window.performance.now

import _wasthon_csv as wcsv
import csv as bcsv
import io

def make_data_simple():
    return '\\n'.join(','.join(str(j) for j in range(10)) for i in range(1000))

def make_data_quoted():
    return '\\n'.join('"col,A","col B",' + ','.join(str(j) for j in range(8)) for i in range(500))

DATA_SIMPLE  = make_data_simple()
DATA_QUOTED  = make_data_quoted()
ROWS_OUT     = [['Alice', '30', 'has, comma'], ['Bob', '25', '']] * 100

def time_loop(fn, iters):
    fn(); fn()
    t0 = perf()
    out = None
    for _ in range(iters):
        out = fn()
    t1 = perf()
    return (t1 - t0) / iters, out

cases = [
    ("parse 1000 simple rows",
        lambda: list(wcsv.reader(io.StringIO(DATA_SIMPLE))),
        lambda: list(bcsv.reader(io.StringIO(DATA_SIMPLE))),
        10),
    ("parse 500 quoted-comma rows",
        lambda: list(wcsv.reader(io.StringIO(DATA_QUOTED))),
        lambda: list(bcsv.reader(io.StringIO(DATA_QUOTED))),
        10),
    ("write 200 rows with embedded commas",
        lambda: (lambda o: (wcsv.writer(o).writerows(ROWS_OUT), o.getvalue())[1])(io.StringIO()),
        lambda: (lambda o: (bcsv.writer(o).writerows(ROWS_OUT), o.getvalue())[1])(io.StringIO()),
        20),
    ("parse tab-delimited 1000 rows",
        lambda: list(wcsv.reader(io.StringIO(DATA_SIMPLE.replace(',', chr(9))), delimiter=chr(9))),
        lambda: list(bcsv.reader(io.StringIO(DATA_SIMPLE.replace(',', chr(9))), delimiter=chr(9))),
        10),
]

log('Running benchmarks…\\n')
for name, wfn, bfn, iters in cases:
    try:
        wms, wout = time_loop(wfn, iters)
    except Exception as e:
        log(f'  wasthon {name} FAIL: {type(e).__name__}: {e}')
        wms, wout = -1, None
    try:
        bms, bout = time_loop(bfn, iters)
    except Exception as e:
        log(f'  brython {name} FAIL: {type(e).__name__}: {e}')
        bms, bout = -1, None
    ok = (wout is not None and bout is not None and
          (len(wout) == len(bout) if isinstance(wout, list) else wout == bout))
    log(f'  {name:42}  wasthon={wms:.4f}  brython={bms:.4f}  match={"✓" if ok else "✗"}')
    render(name, wms, bms, ok)

log('\\n=== done ===')
`;
    document.body.appendChild(py);
    brython({debug: 1});
} catch (e) {
    log('FAILED: ' + e.message);
    console.error(e);
}
</script>
</body>
</html>
