<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wasthon — _statistics bench</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  table { border-collapse: collapse; margin: 1rem 0; width: 100%; font-size: 13px; }
  th, td { padding: 5px 10px; text-align: right; border-bottom: 1px solid #ddd; font-variant-numeric: tabular-nums; }
  th { background: #f4f4f4; text-align: left; }
  td:first-child { text-align: left; }
  .speedup { background: #fff8e0; font-weight: 600; }
  #log { white-space: pre-wrap; font-family: monospace; background: #f8f8f8; padding: 1rem; border-radius: 4px; max-height: 300px; overflow: auto; font-size: 12px; }
</style>
<script src="./brython-src.js"></script>
<script src="./wasthon-loader.js"></script>
</head>
<body>
<p style="font-size:0.85em;margin:0 0 1em 0;"><a href="index.html">← back to index</a></p>

<h1>Wasthon — <code>_statistics._normal_dist_inv_cdf</code> vs Brython</h1>

<table id="results">
  <thead><tr>
    <th>Operation</th><th>wasthon ms</th><th>Brython ms</th>
    <th class="speedup">Speedup</th>
  </tr></thead>
  <tbody></tbody>
</table>

<h3>Log</h3>
<pre id="log"></pre>

<script type="module">
const log = (...args) => {
    const el = document.getElementById('log');
    el.textContent += args.map(a => typeof a === 'string' ? a : String(a)).join(' ') + '\n';
    el.scrollTop = el.scrollHeight;
};
window.__bench_log = log;
window.__bench_render = (op, wMs, bMs) => {
    const tbody = document.querySelector('#results tbody');
    const tr = document.createElement('tr');
    const speedup = (bMs > 0 && wMs > 0) ? (bMs / wMs).toFixed(2) + 'x' : '—';
    tr.innerHTML = `
        <td>${op}</td>
        <td>${wMs < 0 ? 'FAIL' : wMs === 0 ? '< 0.001' : wMs.toFixed(5)}</td>
        <td>${bMs < 0 ? 'FAIL' : bMs === 0 ? '< 0.001' : bMs.toFixed(5)}</td>
        <td class="speedup">${speedup}</td>
    `;
    tbody.appendChild(tr);
};

try {
    log('Loading wasthon _statistics…');
    await wasthonLoad('_wasthon_statistics', '../build/_statistics.mjs', { initName: '_statistics' });
    log('Loaded. Booting Brython…');

    const py = document.createElement('script');
    py.type = 'text/python';
    py.textContent = `
from browser import window
log = window.__bench_log
render = window.__bench_render
perf = window.performance.now

import _wasthon_statistics as ws
from math import sqrt, log as ln, fabs

# Pure-Python translation of the C Wichura AS241 implementation.
# This is what Brython users effectively have when statistics._statistics
# is not present — statistics.py inlines a similar algorithm.
def py_inv_cdf(p, mu, sigma):
    if p <= 0.0 or p >= 1.0:
        raise ValueError("inv_cdf undefined for these parameters")
    q = p - 0.5
    if fabs(q) <= 0.425:
        r = 0.180625 - q * q
        num = (((((((2.5090809287301226727e+3 * r +
                     3.3430575583588128105e+4) * r +
                     6.7265770927008700853e+4) * r +
                     4.5921953931549871457e+4) * r +
                     1.3731693765509461125e+4) * r +
                     1.9715909503065514427e+3) * r +
                     1.3314166789178437745e+2) * r +
                     3.3871328727963666080e+0) * q
        den = (((((((5.2264952788528545610e+3 * r +
                     2.8729085735721942674e+4) * r +
                     3.9307895800092710610e+4) * r +
                     2.1213794301586595867e+4) * r +
                     5.3941960214247511077e+3) * r +
                     6.8718700749205790830e+2) * r +
                     4.2313330701600911252e+1) * r +
                     1.0)
        if den == 0.0:
            raise ValueError("inv_cdf undefined for these parameters")
        x = num / den
        return mu + (x * sigma)
    r = p if q <= 0.0 else (1.0 - p)
    if r <= 0.0 or r >= 1.0:
        raise ValueError("inv_cdf undefined for these parameters")
    r = sqrt(-ln(r))
    if r <= 5.0:
        r = r - 1.6
        num = (((((((7.74545014278341407640e-4 * r +
                     2.27238449892691845833e-2) * r +
                     2.41780725177450611770e-1) * r +
                     1.27045825245236838258e+0) * r +
                     3.64784832476320460504e+0) * r +
                     5.76949722146069140550e+0) * r +
                     4.63033784615654529590e+0) * r +
                     1.42343711074968357734e+0)
        den = (((((((1.05075007164441684324e-9 * r +
                     5.47593808499534494600e-4) * r +
                     1.51986665636164571966e-2) * r +
                     1.48103976427480074590e-1) * r +
                     6.89767334985100004550e-1) * r +
                     1.67638483018380384940e+0) * r +
                     2.05319162663775882187e+0) * r +
                     1.0)
    else:
        r -= 5.0
        num = (((((((2.01033439929228813265e-7 * r +
                     2.71155556874348757815e-5) * r +
                     1.24266094738807843860e-3) * r +
                     2.65321895265761230930e-2) * r +
                     2.96560571828504891230e-1) * r +
                     1.78482653991729133580e+0) * r +
                     5.46378491116411436990e+0) * r +
                     6.65790464350110377720e+0)
        den = (((((((2.04426310338993978564e-15 * r +
                     1.42151175831644588870e-7) * r +
                     1.84631831751005468180e-5) * r +
                     7.86869131145613259100e-4) * r +
                     1.48753612908506148525e-2) * r +
                     1.36929880922735805310e-1) * r +
                     5.99832206555887937690e-1) * r +
                     1.0)
    if den == 0.0:
        raise ValueError("inv_cdf undefined for these parameters")
    x = num / den
    if q < 0.0:
        x = -x
    return mu + (x * sigma)

def time_loop(fn, target_ms=10, cap_iters=2000):
    fn(); fn(); fn()
    t0 = perf()
    for _ in range(5): fn()
    t1 = perf()
    per_iter_estimate = max((t1 - t0) / 5, 1e-6)
    iters = max(20, min(int(target_ms / per_iter_estimate), cap_iters))
    t0 = perf()
    for _ in range(iters):
        fn()
    t1 = perf()
    return (t1 - t0) / iters, iters

# Cover the 3 branches of AS241:
#   |q| <= 0.425           → central region (Test A)
#   r <= 5  (after sqrt)   → near-tail region (Test B)
#   r > 5                  → extreme tail (Test C)
cases = [
    ("inv_cdf(0.5, 0, 1)   [central, q=0]",       lambda: ws._normal_dist_inv_cdf(0.5, 0.0, 1.0),
                                                  lambda: py_inv_cdf(0.5, 0.0, 1.0)),
    ("inv_cdf(0.7, 0, 1)   [central]",            lambda: ws._normal_dist_inv_cdf(0.7, 0.0, 1.0),
                                                  lambda: py_inv_cdf(0.7, 0.0, 1.0)),
    ("inv_cdf(0.975, 0, 1) [near-tail, r<=5]",    lambda: ws._normal_dist_inv_cdf(0.975, 0.0, 1.0),
                                                  lambda: py_inv_cdf(0.975, 0.0, 1.0)),
    ("inv_cdf(0.999, 0, 1) [near-tail]",          lambda: ws._normal_dist_inv_cdf(0.999, 0.0, 1.0),
                                                  lambda: py_inv_cdf(0.999, 0.0, 1.0)),
    ("inv_cdf(1-1e-15)     [extreme tail, r>5]",  lambda: ws._normal_dist_inv_cdf(1.0 - 1e-15, 0.0, 1.0),
                                                  lambda: py_inv_cdf(1.0 - 1e-15, 0.0, 1.0)),
    ("inv_cdf(0.95, 100, 15) [scaled, central]",  lambda: ws._normal_dist_inv_cdf(0.95, 100.0, 15.0),
                                                  lambda: py_inv_cdf(0.95, 100.0, 15.0)),
]

log('Running _statistics benchmarks…\\n')
for name, wfn, bfn in cases:
    # Use -1 as a sentinel for "exception" so the renderer can distinguish
    # an actual failure from a sub-millisecond measurement (which reports 0).
    try:
        wms, _ = time_loop(wfn)
    except Exception as e:
        log(f'  wasthon {name} FAIL: {type(e).__name__}: {e}')
        wms = -1
    try:
        bms, _ = time_loop(bfn)
    except Exception as e:
        log(f'  brython {name} FAIL: {type(e).__name__}: {e}')
        bms = -1
    log(f'  {name:42}  w={wms:.5f}ms  b={bms:.5f}ms')
    render(name, wms, bms)

log('\\n=== done ===')
`;
    document.body.appendChild(py);
    brython({debug: 1});
} catch (e) {
    log('FAILED: ' + e.message);
    console.error(e);
}
</script>
</body>
</html>
