<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wasthon — run all tests</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 950px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 1rem 0; }
  th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #ddd; }
  th { background: #f4f4f4; }
  tr.pending td { color: #999; }
  tr.running td { color: #04a; }
  tr.pass     { background: #e8f6e8; }
  tr.fail     { background: #fde8e8; }
  tr.info     { background: #eef2fb; }
  tr.timeout  { background: #fff4e0; }
  td.duration { font-variant-numeric: tabular-nums; }
  #summary { font-size: 1.2rem; margin-top: 1.5rem; font-weight: 600; }
  .ok   { color: #0a0; }
  .ko   { color: #a00; }
  .warn { color: #a60; }
  iframe { display: none; }
</style>
</head>
<body>
<p style="font-size:0.85em;margin:0 0 1em 0;"><a href="index.html">← back to index</a></p>

<h1>Wasthon — run all tests</h1>
<p style="color:#666;font-size:0.9em;">
  Sequential runner. Each <code>test-*.html</code> is loaded in a hidden iframe;
  completion is detected by the canonical marker <code>=== done ===</code> in the
  page's <code>#log</code>. Bootstrap errors surface as <code>=== FAILED ===</code>.
  Per-page timeout: 60 s.
</p>

<table id="results">
  <thead><tr>
    <th>Page</th>
    <th>Status</th>
    <th>Duration</th>
  </tr></thead>
  <tbody></tbody>
</table>

<div id="summary">⏳ Running…</div>

<script>
// Canonical list of test pages. Keep alphabetical; bundle tests at the end
// because they're the heaviest (load 22-25 modules each).
const PAGES = [
    'test-array.html',
    'test-binascii.html',
    'test-bz2.html',
    'test-cluster.html',
    'test-cmath.html',
    'test-csv.html',
    'test-decimal.html',
    'test-hashlib.html',
    'test-json.html',
    'test-lzma.html',
    'test-math.html',
    'test-pickle.html',
    'test-pyexpat.html',
    'test-sqlite.html',
    'test-sre.html',
    'test-statistics.html',
    'test-zlib.html',
    'test-zstd.html',
    'test-wasthon.html',
    'test-wasthon-full.html',
    'test-scopes.html',
    'test-debug.html',
];

// Informational pages — fishing pages with known-unfixed probes. Their
// ✗ count is shown but does NOT count toward the overall fail tally
// (so CI stays green while the cleanup continues). test-debug.html
// passed 288/288 on 2026-05-24; promoted to regression — any future ✗
// counts as a CI failure.
const INFORMATIONAL = new Set();

const TIMEOUT_MS = 60_000;
const POLL_MS    = 250;

function rowAt(idx) {
    return document.querySelector('#results tbody').children[idx];
}

function init() {
    const tbody = document.querySelector('#results tbody');
    for (const p of PAGES) {
        const tr = document.createElement('tr');
        tr.className = 'pending';
        tr.innerHTML = `
            <td><a href="${p}" target="_blank">${p}</a></td>
            <td>⏳ pending</td>
            <td class="duration">—</td>`;
        tbody.appendChild(tr);
    }
}

function update(idx, cls, label, duration) {
    const tr = rowAt(idx);
    tr.className = cls;
    tr.children[1].textContent = label;
    tr.children[2].textContent = duration === null ? '—' : `${duration} ms`;
}

async function runOne(page, idx) {
    update(idx, 'running', '🔄 running', null);
    const start = performance.now();

    return new Promise(resolve => {
        const iframe = document.createElement('iframe');
        iframe.src = page;
        document.body.appendChild(iframe);

        let done = false;
        const finish = (result) => {
            if (done) return;
            done = true;
            clearInterval(poller);
            clearTimeout(timer);
            const duration = Math.round(performance.now() - start);
            try { document.body.removeChild(iframe); } catch (_) {}
            update(idx, result.cls, result.label, duration);
            resolve(result);
        };

        const poller = setInterval(() => {
            let doc;
            try { doc = iframe.contentDocument; } catch (_) { return; }
            if (!doc) return;
            const logEl = doc.querySelector('#log') || doc.querySelector('pre');
            if (!logEl) return;
            const log = logEl.textContent || '';

            if (log.includes('=== done ===')) {
                const fail = log.includes('=== SOME FAILED ===');
                if (INFORMATIONAL.has(page)) {
                    // Surface the failure count from the GRAND TOTAL line
                    // specifically (not the first per-section footer, which
                    // would just give the count for the first section).
                    const m = log.match(/GRAND TOTAL:\s*\d+\s*✓\s*\/\s*(\d+)\s*✗/);
                    const detail = m ? ` (${m[1]} known ✗)` : '';
                    finish({
                        cls:   'info',
                        label: fail ? `ℹ probes${detail}` : '✓ probes (all OK)',
                    });
                } else {
                    finish({
                        cls:   fail ? 'fail' : 'pass',
                        label: fail ? '✗ fail' : '✓ pass',
                    });
                }
            } else if (log.includes('=== FAILED ===')) {
                finish({cls: 'fail', label: '✗ bootstrap'});
            }
        }, POLL_MS);

        const timer = setTimeout(() => {
            finish({cls: 'timeout', label: '⏱ timeout'});
        }, TIMEOUT_MS);
    });
}

async function runAll() {
    let passed = 0, failed = 0, timedOut = 0, info = 0;
    for (let i = 0; i < PAGES.length; i++) {
        const r = await runOne(PAGES[i], i);
        if (r.cls === 'pass')         passed++;
        else if (r.cls === 'timeout') timedOut++;
        else if (r.cls === 'info')    info++;
        else                          failed++;
    }
    // Pass/fail tally ignores informational pages — CI doesn't fail on them.
    const regressionTotal = PAGES.length - info;
    const summary = document.getElementById('summary');
    if (failed === 0 && timedOut === 0) {
        summary.className = 'ok';
        const tail = info > 0 ? ` (+ ${info} informational)` : '';
        summary.textContent = `✓ ${passed}/${regressionTotal} pages passed${tail}`;
    } else {
        const bits = [`${passed}/${regressionTotal} pages passed`];
        if (failed > 0)   bits.push(`<span class="ko">${failed} failed</span>`);
        if (timedOut > 0) bits.push(`<span class="warn">${timedOut} timed out</span>`);
        if (info > 0)     bits.push(`${info} informational`);
        summary.innerHTML = bits.join(' — ');
    }
}

init();
runAll();
</script>
</body>
</html>
