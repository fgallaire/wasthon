<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wasthon — math bench (int-heavy fns vs Brython)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  table { border-collapse: collapse; margin: 1rem 0; width: 100%; font-size: 13px; }
  th, td { padding: 5px 10px; text-align: right; border-bottom: 1px solid #ddd; font-variant-numeric: tabular-nums; }
  th { background: #f4f4f4; text-align: left; }
  td:first-child { text-align: left; }
  .speedup { background: #fff8e0; font-weight: 600; }
  #log { white-space: pre-wrap; font-family: monospace; background: #f8f8f8; padding: 1rem; border-radius: 4px; max-height: 300px; overflow: auto; font-size: 12px; }
</style>
<script src="./brython-src.js"></script>
<script src="./wasthon-loader.js"></script>
</head>
<body>
<p style="font-size:0.85em;margin:0 0 1em 0;"><a href="index.html">← back to index</a></p>

<h1>Wasthon — <code>math</code> int-heavy functions vs Brython</h1>
<p>Bench the int-arithmetic helpers (factorial / gcd / isqrt / prod), where
the bulk work happens inside libm on BigInt-like data — exactly the
pattern wasthon should win.</p>

<table id="results">
  <thead><tr>
    <th>Operation</th><th>wasthon ms</th><th>Brython ms</th>
    <th class="speedup">Speedup</th>
  </tr></thead>
  <tbody></tbody>
</table>

<h3>Log</h3>
<pre id="log"></pre>

<script type="module">
const log = (...args) => {
    const el = document.getElementById('log');
    el.textContent += args.map(a => typeof a === 'string' ? a : String(a)).join(' ') + '\n';
    el.scrollTop = el.scrollHeight;
};
window.__bench_log = log;
window.__bench_render = (op, wMs, bMs) => {
    const tbody = document.querySelector('#results tbody');
    const tr = document.createElement('tr');
    const speedup = (bMs > 0 && wMs > 0) ? (bMs / wMs).toFixed(2) + 'x' : '—';
    tr.innerHTML = `
        <td>${op}</td>
        <td>${wMs < 0 ? 'FAIL' : wMs === 0 ? '< 0.001' : wMs.toFixed(4)}</td>
        <td>${bMs < 0 ? 'FAIL' : bMs === 0 ? '< 0.001' : bMs.toFixed(4)}</td>
        <td class="speedup">${speedup}</td>
    `;
    tbody.appendChild(tr);
};

try {
    log('Loading wasthon math…');
    await wasthonLoad('_wasthon_math', '../build/math.mjs', { initName: 'math' });
    log('Loaded. Booting Brython…');

    const py = document.createElement('script');
    py.type = 'text/python';
    py.textContent = `
from browser import window
log = window.__bench_log
render = window.__bench_render
perf = window.performance.now

import _wasthon_math as wm
import math as bm  # Brython's math (uses JS Math.*)

# Pure-Python factorial (Brython's math.factorial may be the same — we
# implement the pure version as the canonical "slow Python" reference).
def py_factorial(n):
    r = 1
    for i in range(2, n + 1):
        r *= i
    return r

def py_gcd(a, b):
    while b:
        a, b = b, a % b
    return a

def py_isqrt(n):
    if n < 0:
        raise ValueError
    if n == 0:
        return 0
    x = n
    y = (x + 1) // 2
    while y < x:
        x = y
        y = (x + n // x) // 2
    return x

def py_prod(seq, start=1):
    r = start
    for v in seq:
        r *= v
    return r

def time_loop(fn, target_ms=15, cap_iters=500):
    # Brief warmup so the JIT engages.
    fn(); fn(); fn()
    # Estimate per-iter time from a quick probe.
    t0 = perf()
    for _ in range(3): fn()
    t1 = perf()
    per_iter_estimate = max((t1 - t0) / 3, 1e-6)
    # Cap iters: each call allocates BigInts the bridge keeps until
    # tp_dealloc is implemented. Too many iters → multi-GB memory.
    iters = max(10, min(int(target_ms / per_iter_estimate), cap_iters))
    t0 = perf()
    for _ in range(iters):
        fn()
    t1 = perf()
    return (t1 - t0) / iters, iters

cases = [
    # factorial — the canonical int-heavy benchmark
    ("factorial(50)",       lambda: wm.factorial(50),  lambda: py_factorial(50)),
    ("factorial(200)",      lambda: wm.factorial(200), lambda: py_factorial(200)),
    ("factorial(500)",      lambda: wm.factorial(500), lambda: py_factorial(500)),
    ("gcd(huge, huge)",     lambda: wm.gcd(10**18, 7**18),
                            lambda: py_gcd(10**18, 7**18)),
    ("isqrt(10**18)",       lambda: wm.isqrt(10**18),
                            lambda: py_isqrt(10**18)),
    ("isqrt(10**40)",       lambda: wm.isqrt(10**40),
                            lambda: py_isqrt(10**40)),
    ("prod(range(1, 100))", lambda: wm.prod(list(range(1, 100))),
                            lambda: py_prod(range(1, 100))),
]

log('Running benchmarks (auto-tuned to ~80ms per measurement)…\\n')
for name, wfn, bfn in cases:
    try:
        wms, w_iters = time_loop(wfn)
    except Exception as e:
        log(f'  wasthon {name} FAIL: {type(e).__name__}: {e}')
        wms, w_iters = -1, 0
    try:
        bms, b_iters = time_loop(bfn)
    except Exception as e:
        log(f'  brython {name} FAIL: {type(e).__name__}: {e}')
        bms, b_iters = -1, 0
    log(f'  {name:25}  w={wms:.5f}ms ({w_iters} it)  b={bms:.5f}ms ({b_iters} it)')
    render(name, wms, bms)

log('\\n=== done ===')
`;
    document.body.appendChild(py);
    brython({debug: 1});
} catch (e) {
    log('FAILED: ' + e.message);
    console.error(e);
}
</script>
</body>
</html>
